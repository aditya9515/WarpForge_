name: CPU build, tests, and repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU-only ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            generator: Unix Makefiles
          - os: windows-2022
            generator: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure without CUDA
        shell: pwsh
        run: >-
          cmake -S . -B out/ci -G "${{ matrix.generator }}"
          -DWARPFORGE_ENABLE_CUDA=OFF
          -DWARPFORGE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile CPU library and tests
        run: cmake --build out/ci --config Release --parallel 2
      - name: Run CPU and fixture tests
        run: ctest --test-dir out/ci -C Release --output-on-failure
      - name: Check Python syntax
        run: python -m compileall -q python tests/python scripts
      - name: Check documentation, JSON, and artifact policy
        run: python scripts/check_repository.py
      - name: Verify committed measured-results plot
        run: python scripts/plot_benchmarks.py --check

  format-audit:
    name: Produce clang-format 18 audit patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format a disposable checkout with the preinstalled tool
        shell: bash
        run: |
          clang-format-18 --version
          git ls-files -z -- '*.cpp' '*.cu' '*.cuh' '*.hpp' '*.h' | xargs -0 -r clang-format-18 -i
          mkdir -p out/format-audit
          git diff --binary > out/format-audit/clang-format.patch
          git diff --stat
      - name: Upload mechanical formatting patch
        uses: actions/upload-artifact@v7
        with:
          name: clang-format-18-patch
          path: out/format-audit/clang-format.patch
          if-no-files-found: error
